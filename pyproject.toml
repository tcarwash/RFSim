[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rfsim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
[project.scripts]
rfsim = "rfsim.cli:main"
rfsim-mcp = "rfsim.server:main"
[tool.setuptools]
packages = ["rfsim"]
